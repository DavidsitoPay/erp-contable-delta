# azure-pipelines.yml — Delta ERP Contable
# Pipeline de build (DevOps 1). La integración/entrega continua completa
# y el plan de pruebas se amplían en DevOps 2 (entregable 26/09).

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Build_Backend
    displayName: "Build backend (.NET)"
    jobs:
      - job: BuildApi
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: "sdk"
              version: "8.0.x"
          - script: |
              cd backend/src/DeltaERP.Api
              dotnet restore
              dotnet build --configuration Release
            displayName: "Restore y build de la API"

  - stage: Build_Frontend
    displayName: "Build frontend (React)"
    dependsOn: []
    jobs:
      - job: BuildReact
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
          - script: |
              cd frontend
              npm install
              npm run build
            displayName: "Instalar dependencias y compilar frontend"

  - stage: Build_Images
    displayName: "Build de imágenes Docker"
    dependsOn:
      - Build_Backend
      - Build_Frontend
    jobs:
      - job: DockerBuild
        steps:
          - script: |
              docker compose -f devops/docker-compose.yml build
            displayName: "docker compose build"
