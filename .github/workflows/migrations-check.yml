name: Migraciones — prueba contra copia de producción

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Rama copy-on-write de Neon "production": las migraciones corren contra datos reales.
  migrar-copia-prod:
    name: migrar-copia-prod # nombre estable: es el check requerido en la protección de main
    # PRs de forks no reciben secretos; en ellos el job se omite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BRANCH_NAME: migcheck-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar cliente de PostgreSQL (si falta)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Calcular expiración de la rama (red de seguridad)
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Crear rama Neon efímera desde production
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: production
          branch_name: ${{ env.BRANCH_NAME }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Aplicar migraciones pendientes sobre la copia
        shell: bash # -eo pipefail: sin pipefail, un fallo del script queda enmascarado por tee
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          echo "::add-mask::$DB_URL"
          bash database/run_migrations.sh "$DB_URL" 2>&1 | tee migraciones.log

      - name: Resumen de migraciones
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Migraciones contra copia de Neon production"
            if [ -f migraciones.log ] && grep -qE '^(== |ERROR:|psql:.*ERROR:)' migraciones.log; then
              grep -E '^(== |ERROR:|psql:.*ERROR:)' migraciones.log | sed 's/^== /- /' | sed 's/ ==$//'
            else
              echo "- Sin información de migraciones"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar rama Neon efímera
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
