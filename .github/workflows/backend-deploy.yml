name: Backend — build y despliegue a Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "database/**"
      - "devops/Dockerfile.backend"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions (cualquier rama)

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # Corre contra la branch "production" de Neon; si falla, build-and-deploy no arranca.
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar cliente de PostgreSQL (si falta)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Aplicar migraciones pendientes
        shell: bash # -eo pipefail: sin pipefail, un fallo del script queda enmascarado por tee
        env:
          NEON_CONN: ${{ secrets.NEON_PROD_CONNECTION_STRING }}
        run: bash database/run_migrations.sh "$NEON_CONN" | tee migraciones.log

      - name: Resumen de migraciones
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Migraciones (Neon production)"
            if [ -f migraciones.log ]; then
              if grep -qE '^== (Aplicando|Nada nuevo)' migraciones.log; then
                grep -E '^== (Aplicando|Nada nuevo)' migraciones.log | sed 's/^== /- /' | sed 's/ ==$//'
              else
                echo "- Sin información de migraciones"
              fi
            else
              echo "- Sin información de migraciones"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalizar nombre de imagen a minúsculas
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        # Necesario: el driver "docker" por defecto no soporta cache export a GHA (type=gha).
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen del backend
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: devops/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login en Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Azure Container App con la nueva imagen
        run: |
          az containerapp update \
            --name ca-delta-erp-backend \
            --resource-group rg-delta-erp \
            --image ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Verificar health
        shell: bash
        run: |
          REV=$(az containerapp show --name ca-delta-erp-backend --resource-group rg-delta-erp --query properties.latestRevisionName -o tsv)
          STATE=""
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show --name ca-delta-erp-backend --resource-group rg-delta-erp --revision "$REV" --query properties.healthState -o tsv)
            [ "$STATE" = "Healthy" ] && break
            echo "Intento $i: revisión $REV en estado $STATE, reintento en 10 s"
            sleep 10
          done
          if [ "$STATE" != "Healthy" ]; then
            echo "::error::La revisión $REV no llegó a Healthy (estado: $STATE)"
            exit 1
          fi
          echo "- Revisión $REV: $STATE" >> "$GITHUB_STEP_SUMMARY"
          FQDN=$(az containerapp show --name ca-delta-erp-backend --resource-group rg-delta-erp --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            curl -fsS --max-time 10 "https://${FQDN}/health" && exit 0
            echo "Intento $i: sin respuesta, reintento en 10 s"
            sleep 10
          done
          echo "El backend no respondió /health tras el despliegue." >&2
          exit 1

      - name: Resumen del backend desplegado
        if: ${{ !cancelled() }}
        run: |
          FQDN=$(az containerapp show --name ca-delta-erp-backend --resource-group rg-delta-erp --query properties.configuration.ingress.fqdn -o tsv)
          REV=$(az containerapp show --name ca-delta-erp-backend --resource-group rg-delta-erp --query properties.latestRevisionName -o tsv)
          {
            echo "## Backend desplegado"
            echo "- Imagen: \`${{ steps.image.outputs.name }}:${{ github.sha }}\`"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Revisión: ${REV}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Health: https://${FQDN}/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout de Azure
        if: always()
        run: az logout
        continue-on-error: true # no marcar el run en rojo si nunca hubo sesión que cerrar
