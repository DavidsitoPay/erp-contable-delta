name: Backend — build y despliegue a Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "devops/Dockerfile.backend"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions (cualquier rama)

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  # Corre contra la branch "production" de Neon; si falla, build-and-deploy no arranca.
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar migraciones pendientes
        run: bash database/run_migrations.sh "${{ secrets.NEON_PROD_CONNECTION_STRING }}"

  build-and-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen a minúsculas
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        # Necesario: el driver "docker" por defecto no soporta cache export a GHA (type=gha).
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen del backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: devops/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login en Azure (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Azure Container App con la nueva imagen
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-delta-erp-backend \
              --resource-group rg-delta-erp \
              --image ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Logout de Azure
        if: always()
        run: az logout
        continue-on-error: true # no marcar el run en rojo si nunca hubo sesión que cerrar
