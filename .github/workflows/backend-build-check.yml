name: Backend — verificación rápida de build (dev)

# Solo "dotnet build": valida que compile en push directo a dev, sin el costo
# de Sonar/Neon/Docker de los otros workflows de backend.
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-build-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet build
        run: dotnet build backend/src/DeltaERP.Api/DeltaERP.Api.csproj --configuration Release
