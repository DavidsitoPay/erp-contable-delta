name: Pruebas — backend y frontend (dev)

# Suite completa en push directo a dev: unitarias, integración contra un
# PostgreSQL real (los triggers aplican RN-01/03/05) y pruebas del frontend.
# Sin Sonar/Neon/Docker, que viven en los otros workflows.
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - "database/**"
      - ".github/workflows/backend-build-check.yml"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delta_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_CONN: "Host=localhost;Port=5432;Database=delta_erp_test;Username=postgres;Password=postgres"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pruebas del backend (unitarias e integración)
        run: dotnet test backend/tests/DeltaERP.Tests/DeltaERP.Tests.csproj --configuration Release

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas del frontend
        working-directory: frontend
        run: npm run test:ci
