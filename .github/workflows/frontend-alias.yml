name: Frontend — mantener alias corto de Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}
# Sin filtro de "paths": el plan Hobby de Vercel ignora paths y despliega en todo push a main.

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_4FIZ4HAjSE6dEfEvJBFFceXM
  VERCEL_PROJECT_ID: prj_Ud5Bwv3ttuXWnrTSSnVhUi9sBXA0
  ALIAS: delta-erp-contable.vercel.app

jobs:
  update-alias:
    runs-on: ubuntu-latest
    steps:
      # Vercel dispara su build por webhook casi al mismo tiempo que este
      # workflow arranca; hay que esperar a que el deployment de este commit quede READY.
      - name: Esperar el deployment de producción de este commit
        id: wait
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for i in $(seq 1 30); do
            RESP=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v7/deployments?teamId=${VERCEL_ORG_ID}&projectId=${VERCEL_PROJECT_ID}&target=production&sha=${SHA}&limit=1")

            STATE=$(echo "$RESP" | jq -r '.deployments[0].readyState // empty')
            URL=$(echo "$RESP" | jq -r '.deployments[0].url // empty')

            if [ -n "$STATE" ]; then
              echo "Intento $i: deployment encontrado, estado=$STATE"
              if [ "$STATE" = "READY" ]; then
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "DELETED" ]; then
                echo "El deployment de Vercel para este commit terminó en $STATE." >&2
                exit 1
              fi
            else
              echo "Intento $i: aún no aparece el deployment de este commit en Vercel"
            fi
            sleep 10
          done
          echo "Se agotó el tiempo de espera (5 min) esperando el deployment de Vercel." >&2
          exit 1

      # REST directa, no el CLI: "vercel alias set" da 404 con tokens de scope
      # restringido aunque el mismo token funcione contra la API REST.
      - name: Re-apuntar delta-erp-contable.vercel.app al deployment nuevo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST \
            "https://api.vercel.com/v2/deployments/${{ steps.wait.outputs.url }}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\": \"${ALIAS}\"}")
          echo "$RESP" | jq .
