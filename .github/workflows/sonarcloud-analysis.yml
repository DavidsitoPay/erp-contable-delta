name: SonarCloud — análisis de código

# Requiere desactivar "Automatic Analysis" en SonarCloud (Administration >
# Analysis Method); los dos modos no pueden convivir.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Build y análisis (backend .NET + frontend + SQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para blame y el "new code period".
          fetch-depth: 0

      - name: Configurar JDK (requerido por el scanner de SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache de paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache del dotnet-sonarscanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Instalar dotnet-sonarscanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path ./.sonar/scanner

      # begin/build/end deben ir en UN SOLO step, sin "cd" y sin "dotnet restore"
      # aparte: el scanner engancha el build vía una env var que escribe "begin";
      # separarlos rompe ese enganche.
      - name: SonarCloud — begin, build y end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"DavidsitoPay_erp-contable-delta" \
            /o:"davidsitopay" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="frontend/node_modules/**,frontend/dist/**,**/bin/**,**/obj/**,graphify-out/**"

          dotnet build backend/src/DeltaERP.Api/DeltaERP.Api.csproj --configuration Release

          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
