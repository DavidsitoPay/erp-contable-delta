name: SonarCloud — análisis de código

# Requiere desactivar "Automatic Analysis" en SonarCloud (Administration >
# Analysis Method); los dos modos no pueden convivir.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Build y análisis (backend .NET + frontend + SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delta_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_CONN: "Host=localhost;Port=5432;Database=delta_erp_test;Username=postgres;Password=postgres"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para blame y el "new code period".
          fetch-depth: 0

      - name: Configurar JDK (requerido por el scanner de SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache de paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache del dotnet-sonarscanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Instalar dotnet-sonarscanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Pruebas del frontend con cobertura
        working-directory: frontend
        run: |
          npm ci
          npm run test:ci
          sed -i 's#^SF:src/#SF:frontend/src/#' coverage/lcov.info

      # begin/test/end deben ir en UN SOLO step, sin "cd" y sin "dotnet restore"
      # aparte: el scanner engancha el build vía una env var que escribe "begin";
      # separarlos rompe ese enganche. "dotnet test" compila y corre las pruebas.
      - name: SonarCloud — begin, test y end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"DavidsitoPay_erp-contable-delta" \
            /o:"davidsitopay" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,**/bin/**,**/obj/**,graphify-out/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="frontend/coverage/lcov.info" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/DeltaErpDbContext.cs,**/Entities/**,frontend/src/main.jsx,frontend/src/**/*.css,frontend/**/*.config.js,frontend/src/test/**,**/*.test.*" \
            /d:sonar.cpd.exclusions="database/04_procedures.sql,backend/tests/**,frontend/**/*.test.*,frontend/src/test/**"

          dotnet test backend/tests/DeltaERP.Tests/DeltaERP.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
