<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta ERP Contable</title>

    <!-- Favicon: marca azul con triángulo blanco, sin gradiente -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563EB'/%3E%3Cpath d='M32 16 L48 46 L16 46 Z' fill='%23f8fafc'/%3E%3C/svg%3E"
    />

    <!-- Script inline bloqueante para resolver el tema antes del primer pintado.
         Lee localStorage.getItem("delta_tema"); si no hay valor, usa
         window.matchMedia("(prefers-color-scheme: dark)").matches.
         Fallback: "claro". Se ejecuta antes de cualquier CSS/JS.

         NOTA DE SINCRONIZACIÓN: Esta lógica está duplicada en src/tema.js.
         AMBOS usan la clave "delta_tema" y los valores "claro"/"oscuro".
         Si cambias la lógica aquí, mantén src/tema.js sincronizado.
         El script inline no puede importar módulos ES, por eso se duplica.
    -->
    <script>
      (function() {
        try {
          const guardado = localStorage.getItem("delta_tema");
          if (guardado === "claro" || guardado === "oscuro") {
            document.documentElement.dataset.theme = guardado;
            return;
          }
        } catch (e) {
          // localStorage no disponible (modo privado, etc.)
        }

        // Usa preferencia del SO
        try {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.dataset.theme = "oscuro";
          } else {
            document.documentElement.dataset.theme = "claro";
          }
        } catch (e) {
          // matchMedia no disponible: fallback a claro
          document.documentElement.dataset.theme = "claro";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
