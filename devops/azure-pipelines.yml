# azure-pipelines.yml — Delta ERP Contable
# Pipeline de build (DevOps 1) — cubre el requisito de compilar backend y
# frontend correctamente. El CI/CD real (deploy a Azure/Neon/Vercel) vive
# en GitHub Actions (.github/workflows/backend-deploy.yml); este pipeline
# NO participa en eso. pr: none es deliberado: sin esto, la integración de
# Azure Pipelines con GitHub corre automáticamente en cada Pull Request y
# aparece como check pendiente/en progreso bloqueando el merge en GitHub,
# duplicando lo que ya valida el workflow de Actions.

trigger:
  branches:
    include:
      - main
      - develop

pr: none

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Build_Backend
    displayName: "Build backend (.NET)"
    jobs:
      - job: BuildApi
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: "sdk"
              version: "8.0.x"
          - script: |
              cd backend/src/DeltaERP.Api
              dotnet restore
              dotnet build --configuration Release
            displayName: "Restore y build de la API"

  - stage: Build_Frontend
    displayName: "Build frontend (React)"
    dependsOn: []
    jobs:
      - job: BuildReact
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
          - script: |
              cd frontend
              npm install
              npm run build
            displayName: "Instalar dependencias y compilar frontend"

  # Build_Images (docker compose) se retiró: el proyecto migró de Docker Compose
  # local a despliegue en la nube (Neon + Azure Container Apps + Vercel). La
  # imagen real de producción (devops/Dockerfile.backend) ahora se construye y
  # despliega desde GitHub Actions (.github/workflows/backend-deploy.yml), no
  # desde este pipeline. Este pipeline sigue cubriendo el requisito de DevOps 1
  # de "compilar correctamente backend y frontend" con las dos etapas de arriba.
  - stage: Build_Backend_Image
    displayName: "Build de la imagen Docker del backend"
    dependsOn:
      - Build_Backend
    jobs:
      - job: DockerBuild
        steps:
          - script: |
              docker build -f devops/Dockerfile.backend -t delta-erp-backend:ci backend
            displayName: "docker build (Dockerfile.backend)"
