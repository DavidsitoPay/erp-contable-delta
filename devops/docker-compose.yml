services:
  db:
    image: postgres:16
    container_name: delta-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: delta_erp
      POSTGRES_USER: delta_app
      POSTGRES_PASSWORD: changeme_local_only
    ports:
      - "5432:5432"
    volumes:
      - delta_db_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d
    networks:
      - delta-network

  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: delta-erp-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Database=delta_erp;Username=delta_app;Password=changeme_local_only"
    ports:
      - "5000:5000"
    networks:
      - delta-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
      args:
        VITE_API_URL: "http://localhost:5000/api"
    container_name: delta-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - delta-network

networks:
  delta-network:
    driver: bridge

volumes:
  delta_db_data:
